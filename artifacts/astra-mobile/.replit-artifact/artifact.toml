kind = "mobile"
previewPath = "/astra-mobile/"
title = "AstraVita Mobile"
version = "1.0.0"
id = "artifacts/astra-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/astra-mobile/" ]
localPort = 23416

[services.development]
run = "pnpm --filter @workspace/astra-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/astra-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/astra-mobile", "run", "serve" ]

[services.env]
PORT = "23416"
BASE_PATH = "/astra-mobile/"
